[package]
name = "attune-demo-director"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed Hyprland capture director for the Attune Campaign A demo"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[lints.clippy]
all = "warn"
pedantic = "warn"

