<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research graph</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.45 system-ui,sans-serif; }
  body { margin: 0; padding: 16px; color: CanvasText; background: Canvas; }
  header { display:flex; justify-content:space-between; align-items:start; gap:16px; }
  h1 { font-size:16px; margin:0 0 4px; font-weight:650; }
  #summary,.muted { color: color-mix(in srgb, CanvasText 68%, Canvas); }
  #chart { width:100%; min-height:230px; }
  svg { display:block; width:100%; height:260px; overflow:visible; }
  .axis { stroke:color-mix(in srgb, CanvasText 30%, Canvas); stroke-width:1; }
  .grid { stroke:color-mix(in srgb, CanvasText 12%, Canvas); stroke-width:1; }
  text { fill:CanvasText; font:11px system-ui,sans-serif; }
  .series { fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .point { stroke:Canvas; stroke-width:1.5; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin:4px 0 10px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .swatch { width:9px; height:9px; border-radius:50%; }
  button { font:inherit; color:inherit; background:transparent; border:1px solid color-mix(in srgb, CanvasText 28%, Canvas); border-radius:5px; padding:4px 9px; cursor:pointer; }
  button[aria-pressed="true"] { background:color-mix(in srgb, AccentColor 16%, Canvas); }
  .controls { display:flex; gap:6px; }
  table { border-collapse:collapse; width:100%; margin:8px 0; }
  th,td { text-align:left; padding:4px 7px; border-bottom:1px solid color-mix(in srgb, CanvasText 16%, Canvas); }
  #details { margin-top:8px; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; font:11px/1.4 ui-monospace,monospace; }
  #empty { padding:44px 8px; text-align:center; }
</style>
<body>
  <header><div><h1 id="title">Research graph</h1><div id="summary" class="muted">Waiting for a visualization…</div></div><div class="controls"><button id="graph" aria-pressed="true">Graph</button><button id="table">Table</button><button id="inspect">Provenance</button></div></header>
  <div id="legend" class="legend"></div><div id="chart"></div><section id="details" hidden></section>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", colors = ["#2563eb", "#e4572e", "#199b73", "#9a5bd4", "#c28b00", "#d14f83"];
  const chart = document.querySelector("#chart"), legend = document.querySelector("#legend"), details = document.querySelector("#details");
  let current = null, view = "graph";
  function el(tag, attrs = {}, text) { const n = document.createElementNS(NS, tag); for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, String(v)); if (text !== undefined) n.textContent = String(text); return n; }
  function html(tag, text, parent) { const n = document.createElement(tag); n.textContent = text; parent.append(n); return n; }
  function setView(next) { view = next; document.querySelector("#graph").setAttribute("aria-pressed", String(view === "graph")); document.querySelector("#table").setAttribute("aria-pressed", String(view === "table")); if(current) render(current); }
  document.querySelector("#graph").onclick = () => setView("graph");
  document.querySelector("#table").onclick = () => setView("table");
  document.querySelector("#inspect").onclick = () => { details.hidden = !details.hidden; };
  function rowsFor(s) { const d=s.data||{}; if(Array.isArray(d.rows)) return d.rows; if(Array.isArray(d.series)) return d.series.flatMap(q => (q.x||[]).map((x,i)=>({series:q.label,x,y:q.y[i]}))); if(Array.isArray(d.values)) return d.values.map((value,index)=>({index:index+1,value})); if(Array.isArray(d.matrix)) return d.matrix.flatMap((r,y)=>r.map((value,x)=>({x:x+1,y:y+1,value}))); if(Array.isArray(d.nodes)) return d.nodes.map(n=>({node:n.id,label:n.label||"",state:n.state||""})); return []; }
  function table(s) { const rs=rowsFor(s); if(!rs.length){html("div","No tabular data provided.",chart);return;} const keys=[...new Set(rs.flatMap(Object.keys))].slice(0,12), t=document.createElement("table"), head=t.createTHead().insertRow(); for(const k of keys) html("th",k,head); const body=t.createTBody(); for(const row of rs.slice(0,100)){const tr=body.insertRow(); for(const k of keys) html("td",typeof row[k]==="object"?JSON.stringify(row[k]):String(row[k]??""),tr);} chart.append(t); }
  function axes(svg, xLabel, yLabel, bounds) { const {left=58,right=12,top=18,bottom=42,xRange=[0,1],yRange=[0,1]}=bounds||{},w=760,h=250, pw=w-left-right,ph=h-top-bottom; for(let i=0;i<=4;i++){const y=top+ph*i/4,x=left+pw*i/4;svg.append(el("line",{x1:left,y1:y,x2:w-right,y2:y,class:i===4?"axis":"grid"}));svg.append(el("text",{x:left-7,y:y+4,"text-anchor":"end"},(yRange[1]-(yRange[1]-yRange[0])*i/4).toPrecision(3)));if(i===0||i===2||i===4)svg.append(el("text",{x,y:h-23,"text-anchor":"middle"},(xRange[0]+(xRange[1]-xRange[0])*i/4).toPrecision(3)));} svg.append(el("line",{x1:left,y1:top,x2:left,y2:top+ph,class:"axis"}));svg.append(el("text",{x:left+pw/2,y:h-5,"text-anchor":"middle"},xLabel||""));const y=el("text",{x:8,y:top+5});y.textContent=yLabel||"";svg.append(y);return {left,right,top,bottom,w,h,pw,ph}; }
  function renderSeries(s, svg, a) { const series=s.data.series||[], xs=series.flatMap(q=>q.x||[]),ys=series.flatMap(q=>q.y||[]); if(!xs.length||!ys.length)return; let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys); if(xmin===xmax)xmax=xmin+1;if(ymin===ymax){ymin-=1;ymax+=1;} const X=x=>a.left+(x-xmin)/(xmax-xmin)*a.pw,Y=y=>a.top+a.ph-(y-ymin)/(ymax-ymin)*a.ph;
    series.forEach((q,si)=>{const col=colors[si%colors.length],points=(q.x||[]).map((x,i)=>[X(x),Y(q.y[i]),x,q.y[i]]); if(s.type==="bar"){const width=Math.max(3,Math.min(26,a.pw/Math.max(1,points.length*series.length)*.7));points.forEach((p,i)=>svg.append(el("rect",{x:p[0]-width/2+si*width,y:p[1],width,height:a.top+a.ph-p[1],fill:col,rx:2})));} else {svg.append(el("polyline",{points:points.map(p=>p[0]+","+p[1]).join(" "),class:"series",stroke:col}));points.forEach(p=>svg.append(el("circle",{cx:p[0],cy:p[1],r:3.5,fill:col,class:"point"})));}});
    series.forEach((q,i)=>{const item=document.createElement("span"),dot=document.createElement("i");dot.className="swatch";dot.style.background=colors[i%colors.length];item.append(dot,document.createTextNode(q.label));legend.append(item);}); }
  function render(s) { current=s; document.querySelector("#title").textContent=s.title||"Research graph"; const p=s.provenance||{},ids=s.identifiers||{}; document.querySelector("#summary").textContent=[s.type, s.yAxis?.unit||s.yAxis?.label, s.epistemic, p.source, ids.experimentId].filter(Boolean).join(" · "); chart.replaceChildren();legend.replaceChildren(); if(view==="table"){table(s);return;} const svg=el("svg",{viewBox:"0 0 760 250",role:"img","aria-label":s.title||"Visualization"}); chart.append(svg);
    if(["line","sparkline","bar","scatter"].includes(s.type)){const series=s.data.series||[],xs=series.flatMap(q=>q.x||[]),ys=series.flatMap(q=>q.y||[]),xr=xs.length?[Math.min(...xs),Math.max(...xs)]:[0,1],yr=ys.length?[Math.min(...ys),Math.max(...ys)]:[0,1];if(xr[0]===xr[1])xr[1]=xr[0]+1;if(yr[0]===yr[1]){yr[0]-=1;yr[1]+=1;}const a=axes(svg,s.xAxis?.label+(s.xAxis?.unit?` (${s.xAxis.unit})`:""),s.yAxis?.label+(s.yAxis?.unit?` (${s.yAxis.unit})`:""),{xRange:xr,yRange:yr});renderSeries(s,svg,a);}
    else if(s.type==="histogram"){const values=s.data.values||[],min=Math.min(...values),max=Math.max(...values),count=Math.min(12,Math.max(4,Math.ceil(Math.sqrt(values.length)))),bins=Array(count).fill(0),span=max-min||1;values.forEach(v=>bins[Math.min(count-1,Math.floor((v-min)/span*count))]++);const a=axes(svg,s.xAxis?.label||"value",s.yAxis?.label||"count");const peak=Math.max(...bins,1);bins.forEach((n,i)=>svg.append(el("rect",{x:a.left+i*a.pw/count+2,y:a.top+a.ph-n/peak*a.ph,width:a.pw/count-4,height:n/peak*a.ph,fill:colors[0],rx:2})));}
    else if(s.type==="heatmap"){const m=s.data.matrix||[],flat=m.flat(),lo=Math.min(...flat),hi=Math.max(...flat);m.forEach((row,y)=>row.forEach((v,x)=>{const t=(v-lo)/(hi-lo||1);svg.append(el("rect",{x:60+x*650/row.length,y:18+y*205/m.length,width:640/row.length,height:195/m.length,fill:`hsl(${210-180*t} 65% ${86-38*t}%)`,stroke:"Canvas"}));}));}
    else if(s.type==="tree"){const ns=s.data.nodes||[],es=s.data.edges||[],depth=new Map();ns.forEach(n=>depth.set(n.id,0));for(let pass=0;pass<ns.length;pass++)es.forEach(e=>depth.set(e.target,Math.max(depth.get(e.target)||0,(depth.get(e.source)||0)+1)));const levels={};ns.forEach(n=>(levels[depth.get(n.id)||0]??=[]).push(n));const pos=new Map();Object.entries(levels).forEach(([d,nodes])=>nodes.forEach((n,i)=>pos.set(n.id,{x:100+Number(d)*180,y:35+(i+1)*175/(nodes.length+1)})));es.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(a&&b)svg.append(el("line",{x1:a.x+55,y1:a.y+10,x2:b.x,y2:b.y+10,stroke:colors[0],"stroke-width":2}));});ns.forEach(n=>{const p=pos.get(n.id);svg.append(el("rect",{x:p.x,y:p.y,width:110,height:30,rx:5,fill:"color-mix(in srgb, AccentColor 20%, Canvas)",stroke:colors[0]}));svg.append(el("text",{x:p.x+6,y:p.y+19},n.label||n.id));});}
    else table(s);
    details.replaceChildren();const provenance=details;html("strong","Provenance: ",provenance);html("span",JSON.stringify({epistemic:s.epistemic,provenance:p,identifiers:ids,update:s.update||{}},null,2),provenance);
  }
  function accept(value){if(!value||value.schema!=="attune.visualization.v1"||!value.data)return;try{if(JSON.stringify(value).length>32768)throw Error();render(value);}catch(_){chart.replaceChildren();html("div","This visualization payload is invalid or too large.",chart);}}
  window.addEventListener("message",event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=="2.0")return;if(m.method==="ui/notifications/tool-result")accept(m.params?.structuredContent);if(m.method==="ui/notifications/tool-input")accept(m.params?.arguments?.spec);});
  if(window.openai?.toolOutput)accept(window.openai.toolOutput);
})();
</script>
</body>
</html>
