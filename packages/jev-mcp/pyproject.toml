[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mcp"
version = "0.1.0"
description = "A privacy-minimized MCP server for bounded Jev semantic decisions"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.29,<2",
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
